<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My work page</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#6b7385;--ac:#2b5cd9;--ok:#1f9d55;--warn:#d9822b;--bad:#c0392b;--bd:#e3e6ec}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2030;--tx:#e8ebf2;--mut:#98a0b3;--bd:#2a3145;--ac:#6b8ff0}}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1,.mut,.row>div,.card b{min-width:0;overflow-wrap:anywhere}h1{font-size:1.4rem;margin:0 0 4px}h2{font-size:1.1rem;margin:24px 0 10px}h3{font-size:1rem;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.mut{color:var(--mut);font-size:.9rem}.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.big{font-size:1.6rem;font-weight:700}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.8rem;background:var(--bd);margin:2px 2px 2px 0}
.fb{border-left:3px solid var(--ac);padding-left:10px;margin-top:10px;white-space:pre-wrap}
.rt{border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-top:8px}.rt.now{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}.rt.brk{background:rgba(245,158,11,.08)}.rt.offr{opacity:.7}.rtT{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.nowTag{background:var(--ac);color:#fff;border-radius:999px;font-size:11px;padding:1px 8px;font-weight:700}.rtMain{margin-top:6px;font-size:18px}.zb{display:inline-block;background:var(--ac);color:#fff;border-radius:10px;padding:4px 12px;font-weight:700;font-size:20px}.zb.tb{background:var(--ok)}.rtTb{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tn{min-width:38px;text-align:center;padding:5px 8px;border-radius:9px;border:1px solid var(--ac);font-weight:700;font-size:16px}
.day{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.day:last-child{border:0}
.work{color:var(--ok);font-weight:600}.off{color:var(--mut)}.leave{color:var(--warn);font-weight:600}.bad{color:var(--bad);font-weight:600}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
select,input,textarea{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--card)}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
#login{text-align:center;margin-top:60px}.err{color:var(--bad);margin:12px 0}
nav{display:flex;gap:6px;overflow-x:auto;margin:16px 0 4px;padding-bottom:4px}
nav button{white-space:nowrap;padding:6px 12px;border-radius:99px;font-size:.9rem}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;cursor:pointer;text-align:left}
.tile b{display:block;font-size:1.4rem}.tile span{font-size:.85rem;color:var(--mut)}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0}dt{color:var(--mut)}dd{margin:0;overflow-wrap:anywhere;min-width:0}
.banner{background:#fff4e0;color:#7a4a00;border:1px solid #f0c27a;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:.9rem}
@media(prefers-color-scheme:dark){.banner{background:#3a2a10;color:#f5d39b;border-color:#6b4d1d}}
table{border-collapse:collapse;width:100%;font-size:.9rem}
nav.main3{position:sticky;top:0;z-index:5;background:var(--bg);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 0}nav.main3 button{padding:10px 8px;font-size:1rem;font-weight:600;border-radius:12px}
.tile.hl{border-color:var(--ac)}.tile.warnT b{color:var(--bad)}.tile.okT b{color:var(--ok)}.click{cursor:pointer}h2{scroll-margin-top:70px}td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--mut);font-weight:600}
</style></head><body><main>
<div id="login"><h1>My work page</h1><p class="mut">Sign in with the Google account your trainer has on file.</p>
<div id="gbtn" style="display:inline-block"></div><div id="err" class="err"></div></div>
<div id="app" hidden></div>
</main>
<script>
/* ===== SETTINGS ===== */
var CLIENT_ID = '121975980339-fu9nd124kov2g6j94qiofOrkjkhbkee6.apps.googleusercontent.com';
var SERVER_URL = 'PASTE-YOUR-APPS-SCRIPT-WEB-APP-URL-HERE';   /* ends in /exec */
/* ==================== */
/* Employee self-service. Everything shown here comes from the Apps Script action "me", which checks the Google sign-in and returns ONLY this person's own data
   (profile, shared evaluations with comments, retraining, game counts, schedule, rotation, own requests, v3.31: own pay statements, bonuses, incidents and the remarks staff chose to show). Nothing about other people is ever sent to this page. */
var tok = null, D = null, tab = 'home', refreshT = null, DEMO = /[?&]demo\b/.test(location.search);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(id){return document.getElementById(id)}
function err(m){$('err').textContent=m}
function say(m){if(!$('app').hidden){var t=$('toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');t.style.cssText='position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:90vw;padding:10px 16px;border-radius:10px;background:var(--tx);color:var(--bg);z-index:9;font-size:.9rem;box-shadow:0 6px 20px rgba(0,0,0,.3)';document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(function(){t.hidden=true},4000)}else err(m)}
function configured(){return /^https:\/\/script\.google\.com\/.+\/exec$/.test(SERVER_URL)}
function init(){
  if(DEMO){D=demoData();show();return}
  if(!configured()){err('This page is not set up yet: the Apps Script web app address is missing (SERVER_URL). Ask the tool admin.');}
  if(!window.google||!google.accounts){return setTimeout(init,200)}
  google.accounts.id.initialize({client_id:CLIENT_ID,callback:function(r){tok=r.credential;load()},auto_select:false});
  google.accounts.id.renderButton($('gbtn'),{theme:'outline',size:'large'});
}
var ERRS={'no employee found for this email':'This Google account is not on the employee list. Ask your trainer to check your email.','sign-in invalid':'Your sign-in failed or expired. Please sign in again.','not configured':'The service is not set up yet.'};
function call(body){
  if(DEMO)return Promise.resolve(demoCall(body));
  if(!configured())return Promise.reject(new Error('not configured'));
  body.idToken=tok;
  return fetch(SERVER_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(function(r){return r.json()});
}
function signOut(){tok=null;D=null;try{if(window.google&&google.accounts&&google.accounts.id)google.accounts.id.disableAutoSelect()}catch(e){}try{sessionStorage.clear()}catch(e){}location.reload()}
function signedOut(m){tok=null;if(refreshT){clearInterval(refreshT);refreshT=null}$('app').hidden=true;$('login').hidden=false;err(m)}
function load(silent){
  if(!silent&&$('app').hidden)err('Loading...');
  call({action:'me'}).then(function(j){
    if(j.error){if(j.error==='sign-in invalid')return signedOut(ERRS[j.error]);if(!silent)say(ERRS[j.error]||j.error);return}
    D=j;show()}).catch(function(){if(!silent)say('Could not reach the server. Please try again.')});
}

/* ---------- helpers ---------- */
var SH={morning:'Morning',afternoon:'Afternoon',night:'Night'},OFF={rest:'Day off',vacation:'Vacation',sick:'Sick leave',unpaid:'Unpaid leave'};
var RT={swap:'Swap a shift',giveaway:'Give away a shift',annual:'Vacation / annual leave',sick:'Sick leave',dayoff:'Day off',payq:'Question about my pay'},RS={pending:'Waiting for a decision',approved:'Approved',rejected:'Declined',cancelled:'Cancelled'};
function rtl(t){return Object.prototype.hasOwnProperty.call(RT,t)?RT[t]:'Request'}function rsl(t){return Object.prototype.hasOwnProperty.call(RS,t)?RS[t]:String(t||'')}
function hh(n){n=((n%24)+24)%24;return String(Math.floor(n)).padStart(2,'0')+':'+(n%1?'30':'00')}
function cellTxt(v){v=String(v||'').trim();if(!v)return '-';if(/^\d+$/.test(v))return 'Table '+v;if(/^(b|brk|break)$/i.test(v))return 'Break';if(/^(off|x|-)$/i.test(v))return 'Off';return v}
function dLabel(d,long){var dt=new Date(d+'T12:00:00');return isNaN(dt)?esc(d):dt.toLocaleDateString(undefined,{weekday:long?'long':'short',day:'numeric',month:'short'})}
function iso(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}
function today(){return iso(new Date())}
function when(ms){return ms?new Date(ms).toLocaleString(undefined,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):''}
/* points lost per criterion: same rule as before (the best criterion score of that evaluation is the maximum, at least 1) */
function lostOf(e){var mx=Math.max.apply(null,[1].concat(e.criteria.map(function(c){return c.score||0})));return e.criteria.filter(function(c){return c.score!=null&&c.score<mx}).map(function(c){return{name:c.name,group:c.group,lost:mx-c.score,score:c.score,max:mx}})}
function mistakes(){
  var m={};(D.evaluations||[]).forEach(function(e){lostOf(e).forEach(function(c){var k=(e.game||'Evaluation')+'|'+c.name;var x=m[k]=m[k]||{game:e.game||'Evaluation',name:c.name,n:0,last:'',lastTs:0};x.n++;if((e.ts||0)>=x.lastTs){x.lastTs=e.ts||0;x.last=e.date}})});
  return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.n-a.n||b.lastTs-a.lastTs});
}
function ended(y){if(y.d!==today()||y.f==null||y.t==null)return false;var f=+y.f,t=+y.t;if(t<=f)t+=24;var m=new Date(y.d+'T00:00:00');return Date.now()>=m.getTime()+t*36e5}
function workDays(){return ((D.schedule&&D.schedule.days)||[]).filter(function(y){return SH[y.s]&&y.d>=today()&&!ended(y)})}

/* ---------- pages (v3.31: three buttons: Home, Schedule, Rotation. Everything here is read-only; the only thing an employee can do is send requests) ---------- */
var TABS=[['home','&#127968; Home'],['schedule','&#128197; Schedule'],['rotation','&#128260; Rotation']],openEv=null,openPay=false;
var RK={positive:['&#128077;','Positive feedback','work'],remark:['&#128221;','Remark','leave'],violation:['&#9888;','Violation','bad'],disciplinary:['&#9940;','Disciplinary case','bad'],note:['&#128466;','Note','off']};
function money(v,c){return (Math.round((+v||0)*100)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+' '+esc(c||'')}
function monthName(ym){var dt=new Date(ym+'-01T12:00:00');return isNaN(dt)?esc(ym):dt.toLocaleDateString(undefined,{month:'long',year:'numeric'})}
function normPay(x){if(!x)return null;var T=x.totals=x.totals||{};['shifts','hours','total','earned','leave','planned','plannedShifts','plannedHours'].forEach(function(k){if(T[k]==null)T[k]=0});x.days=x.days||[];x.upTo=x.upTo||today();x.bonus=x.bonus||[];x.extra=x.extra||[];return x}
function payNow(){var p=D.pay||[],y=today().slice(0,7);return normPay(p.filter(function(x){return x&&x.ym===y})[0]||null)}
function payLast(){var p=D.pay||[],y=today().slice(0,7);return normPay(p.filter(function(x){return x&&x.ym<y})[0]||null)}
var DRAFT=null,NODRAFT=false;
function keepDraft(){if(NODRAFT){NODRAFT=false;DRAFT=null;return}var f=['rqT','rqDay','rqW','rqF','rqTo','rqN'],o={},any=false;f.forEach(function(i){var e=$(i);if(e){o[i]=e.value;if(i!=='rqT'&&i!=='rqDay'&&e.value)any=true}});if(o.rqT!==undefined)DRAFT={v:o,any:any}}
function restoreDraft(){if(!DRAFT)return;var o=DRAFT.v;['rqT','rqDay','rqW','rqF','rqTo','rqN'].forEach(function(i){var e=$(i);if(e&&o[i]!=null&&i!=='rqT')e.value=o[i]});var t=$('rqT');if(t&&o.rqT){t.value=o.rqT;t.dispatchEvent(new Event('change'));['rqDay','rqW','rqF','rqTo','rqN'].forEach(function(i){var e=$(i);if(e&&o[i]!=null)e.value=o[i]})}}
function show(){
  keepDraft();
  $('login').hidden=true;var a=$('app');a.hidden=false;if(!TABS.some(function(t){return t[0]===tab}))tab='home';
  var h=(DEMO?'<div class="banner"><b>Demo data.</b> This page is not connected to the server. Nothing you do here is sent anywhere. <button type="button" onclick="D=demoData(\'presenter\');tab=\'rotation\';show();scrollTo(0,0)">Game presenter</button> <button type="button" onclick="D=demoData(\'shuffler\');tab=\'rotation\';show();scrollTo(0,0)">Shuffler</button></div>':'')+
    '<div class="row"><div><h1>Hello, '+esc(firstName())+'</h1><div class="mut">'+esc(D.email)+'</div></div><span><button onclick="load()">&#8635; Refresh</button> <button onclick="signOut()">Sign out</button></span></div>'+
    '<nav class="main3">'+TABS.map(function(t){return '<button data-t="'+t[0]+'" class="'+(t[0]===tab?'on':'')+'">'+t[1]+'</button>'}).join('')+'</nav><div id="pg"></div>';
  a.innerHTML=h;
  a.querySelector('nav').onclick=function(e){var b=e.target.closest('button');if(b){tab=b.getAttribute('data-t');show();window.scrollTo(0,0)}};
  var P={home:pHome,schedule:pSchedule,rotation:pRotation};
  $('pg').innerHTML=(P[tab]||pHome)();
  if(tab==='schedule'){wireRequests();restoreDraft()}
  [].forEach.call(document.querySelectorAll('[data-go]'),function(x){x.onclick=function(){var g=x.getAttribute('data-go');if(g.charAt(0)==='#'){var el=document.querySelector(g);if(el)el.scrollIntoView({behavior:'smooth'});return}tab=g;show();window.scrollTo(0,0)}});
  [].forEach.call(document.querySelectorAll('[data-ev]'),function(x){x.onclick=function(){var i=+x.getAttribute('data-ev');openEv=openEv===i?null:i;show();var el=document.getElementById('ev'+i);if(el)el.scrollIntoView({block:'nearest'})}});
  var ps=document.getElementById('payShifts');if(ps)ps.onclick=function(){openPay=!openPay;show();var el=document.getElementById('paycard');if(el)el.scrollIntoView({block:'start'})};
  if(!refreshT&&!DEMO)refreshT=setInterval(function(){if(!document.querySelector('#rqForm:focus-within'))load(true)},60000);
}
function tile(go,n,l,cls){return '<button class="tile'+(cls?' '+cls:'')+'" data-go="'+go+'"><b>'+n+'</b><span>'+l+'</span></button>'}
function pHome(){
  var p=D.profile||{},ev=D.evaluations||[],last=ev[0],wd=workDays(),next=wd[0],mi=mistakes(),inc=D.incidents||[],rm=D.remarks||[],pn=payNow(),pl=payLast(),y=today().slice(0,7);
  var incM=inc.filter(function(x){return x.date.slice(0,7)===y}).length,bad=rm.filter(function(x){return x.kind==='violation'||x.kind==='disciplinary'}).length,good=rm.filter(function(x){return x.kind==='positive'}).length;
  var gm=(D.gameCounts||[]).filter(function(g){return g.period.slice(0,7)===y}).reduce(function(s,g){return s+g.count},0);
  var h='<div class="tiles">'+
    tile('#paycard',pn?money(pn.totals.total,pn.cur):pl?money(pl.totals.total,pl.cur):'-',pn?'Earned so far in '+monthName(pn.ym).split(' ')[0]:pl?'Salary for '+monthName(pl.ym):'Salary not published yet','hl')+
    tile('#paycard',pn?pn.totals.shifts+' · '+pn.totals.hours+' h':'-','Shifts · hours this month')+
    tile('#evals',last?(last.total==null?'-':esc(last.total)+'%'):'-',last?'Last evaluation: '+esc(last.game||''):'No evaluation shared yet')+
    tile('#mistakes',mi.length+incM,'Mistakes (criteria with points lost + incidents this month)')+
    tile('#remarks',bad,'Violations & disciplinary',bad?'warnT':'')+
    tile('#remarks',good,'Positive feedback',good?'okT':'')+
    tile('#games',gm?gm.toLocaleString():'-','Games this month')+
    tile('schedule',next?dLabel(next.d):'-',next?'Next shift: '+SH[next.s]+(next.f!=null?' '+hh(next.f):''):'No upcoming shift sent')+'</div>';
  /* personal information */
  h+='<h2>My information</h2><div class="card"><dl>'+[['Name',p.name],['Nickname',p.nickname],['Employee ID',p.workId],['Position',p.position],['Team',p.team],['Team manager',p.manager],['Shift',p.shift],['Start date',p.startDate],['Status',p.status],['Phone',p.phone],['Email',p.email||D.email]].map(function(f){return '<dt>'+f[0]+'</dt><dd>'+(f[1]?esc(f[1]):'<span class="mut">not on file</span>')+'</dd>'}).join('')+'</dl>'+((p.games||[]).length?'<label>Games I am trained on</label>'+p.games.map(function(g){return '<span class="tag">'+esc(g)+'</span>'}).join(''):'')+'<div class="mut" style="margin-top:8px">Something wrong? Tell your manager or HR, or send a request from Schedule.</div></div>';
  /* salary */
  h+='<h2 id="paycard">My salary</h2>';
  if(!pn&&!pl)h+='<div class="card mut">Your salary has not been published yet. It appears here after your manager\'s tool updates the pay pages.</div>';
  [pn,pl].forEach(function(st,ix){if(!st)return;var T=st.totals,cur=ix===0;
    h+='<div class="card"><div class="row"><div><b>'+monthName(st.ym)+'</b> <span class="tag">'+(st.final?'Final':cur?'So far (up to '+dLabel(st.upTo)+')':'Not final yet')+'</span><div class="mut">'+T.shifts+' shift'+(T.shifts===1?'':'s')+' · '+T.hours+' hours'+(st.unit==='hour'?' · paid per hour':' · paid per shift')+'</div></div><div class="big">'+money(T.total,st.cur)+'</div></div>'+
      '<div class="day"><span>Shifts</span><span>'+money(T.earned,st.cur)+'</span></div>'+(T.leave?'<div class="day"><span>Paid leave</span><span>'+money(T.leave,st.cur)+'</span></div>':'')+
      (st.bonus||[]).map(function(b){return '<div class="day"><span>&#127941; '+esc(b.name)+' <span class="tag">Level '+b.level+' of '+b.of+'</span></span><span class="work">+'+money(b.amount,st.cur)+'</span></div>'}).join('')+
      (st.extra||[]).map(function(b){return '<div class="day"><span>&#127873; '+esc(b.name)+' <span class="mut">'+esc(b.date)+'</span></span><span class="work">+'+money(b.amount,st.cur)+'</span></div>'}).join('')+
      (cur&&!st.final?'<div class="mut" style="margin-top:6px">'+(T.plannedShifts?'Still planned this month: '+T.plannedShifts+' shift'+(T.plannedShifts===1?'':'s')+' ('+T.plannedHours+' h, about '+money(T.planned,st.cur)+'). ':'')+'Bonuses are shown when your manager closes the month.</div>':'')+
      (cur?'<div style="margin-top:8px"><button id="payShifts">'+(openPay?'Hide':'Show')+' each shift</button></div>':'')+
      (cur&&openPay?'<table style="margin-top:8px"><tr><th>Day</th><th>Shift</th><th>Hours</th><th>Rate</th><th>Pay</th></tr>'+st.days.map(function(d){var w=d.k==='day'||d.k==='night';return '<tr><td>'+dLabel(d.d)+'</td><td>'+(w?esc(SH[d.s]||d.s||(d.k==='night'?'Night':'Day'))+' <span class="mut">'+(d.k==='night'?'night rate':'day rate')+'</span>':esc({vac:'Vacation',sick:'Sick leave',study:'Study leave',fam:'Family leave',unp:'Unpaid'}[d.k]||d.k))+(d.mult>1?' <span class="tag">×'+d.mult+'</span>':'')+'</td><td>'+(w?d.h+(d.act?' <span class="leave" title="Hours entered by your manager (e.g. left early)">*</span>':''):'')+'</td><td>'+(w?money(d.rate,''):'')+'</td><td><b>'+money(d.amt,'')+'</b></td></tr>'}).join('')+'</table><div class="mut">* hours changed by your manager (for example you left early). Questions? Send "Question about my pay" from Schedule.</div>':'')+'</div>'});
  /* evaluations */
  h+='<h2 id="evals">My evaluations</h2>';
  if(!ev.length)h+='<div class="card mut">No results have been shared with you yet.</div>';
  ev.forEach(function(e,i){var lost=lostOf(e),on=openEv===i,mx=Math.max.apply(null,[1].concat(e.criteria.map(function(c){return c.score||0})));
    h+='<div class="card" id="ev'+i+'"><div class="row click" data-ev="'+i+'"><div><b>'+esc(e.game||'Evaluation')+'</b>'+(e.kind?' <span class="tag">'+esc(e.kind)+'</span>':'')+'<div class="mut">'+esc(e.date)+' · '+(lost.length?lost.length+' criteria with points lost':'full score')+' · '+(on?'tap to close':'tap for details and comments')+'</div></div><div class="big">'+(e.total==null?'-':esc(e.total))+'%</div></div>';
    if(on){e.criteria.filter(function(c){return c.score!=null}).sort(function(x,y){return x.score-y.score}).forEach(function(c){var full=c.score>=mx;h+='<div class="day"><span>'+esc(c.name)+(c.note?'<div class="mut">&#128172; '+esc(c.note)+'</div>':'')+'</span><span class="'+(full?'work':'leave')+'">'+(full?'&#10003; Full':'&minus;'+(mx-c.score)+' ('+c.score+'/'+mx+')')+'</span></div>'});
      if(e.improve&&e.improve.length)h+='<div style="margin-top:8px"><span class="mut">Focus on: </span>'+e.improve.map(function(x){return '<span class="tag">'+esc(x)+'</span>'}).join(' ')+'</div>';
      if(e.feedback)h+='<div class="fb">'+esc(e.feedback)+'</div>'}
    h+='</div>'});
